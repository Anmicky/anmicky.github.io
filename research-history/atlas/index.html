function dateDetails(n){const d=n.dates,rows=[];if(n.type==='meeting')rows.push('会议日期：'+(d.event_at||'未核定'));for(const [key,label]of [['published_at','发表'],['preprint_at','预印本首发'],['document_at','文档／导出'],['archived_at','收录'],['announcement_at','作者消息']])if(d[key])rows.push(label+'：'+d[key]);if(d.issue_year)rows.push('卷期年：'+d.issue_year);return rows.join('；')}
function choose(id){if(id.startsWith('nav:')){branchId=id.slice(4);setMode('branch');return}selected=id;highlight();const n=index.get(id);if(!n)return;const related=[...S.relations,...V.visual_edges,...(mode==='field'?[]:V.project_edges)].filter(e=>e.from===id||e.to===id);const unique=new Map();related.forEach(e=>{const other=e.from===id?e.to:e.from;if(!unique.has(other))unique.set(other,e)});$('#detail').innerHTML=`<p class="small">${escapeHTML(n.date)} · ${escapeHTML(n.date_note)}</p><h2>${escapeHTML(n.title)}</h2><p>${escapeHTML(n.brief)}</p><p class="small">${escapeHTML(n.full)}</p><h3>证据与限制</h3><p>${escapeHTML(n.limit)}</p><p class="small">${escapeHTML(dateDetails(n))}</p><p class="small">读取层级：${escapeHTML(n.grade)}</p><p class="small">来源：${n.source_ids.map(k=>escapeHTML(S.sources[k].label)).join('；')}</p><p><a href="${escapeHTML(n.url)}" target="_blank" rel="noopener">打开原始来源／档案 ↗</a></p><h3>相邻路线</h3><div class="relation-buttons">${[...unique].map(([other,e])=>`<button data-go="${other}">${escapeHTML(e.evidence==='direct'?'已核关系':'主题归纳／待核')} → ${escapeHTML(index.get(other)?.title||other)}</button>`).join('')||'<p class="small">本轮未画出已核相邻关系；不强行接到统一母节点。</p>'}</div><p class="small">虚线是本图按主题整理的联系，不表示已证实的引用、传承或因果。</p>`;$('#detail').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#drawer').hidden=false;$('#closeDrawer').focus({preventScroll:true})}
function go(id){if(!allItems().some(n=>n.id===id))setMode(S.views.field.includes(id)?'branch':'project');$('#topic').value='all';$('#type').value='all';$('#person').value='all';$('#query').value='';filter(false);selected=id;choose(id);if(list)nodes.get(id).scrollIntoView({block:'center'});else centerNode(id)}
function centerNode(id){const p=positions[id];if(!p)return;viewport.scrollTo({left:Math.max(0,(p.x+110)*scale-viewport.clientWidth/2),top:Math.max(0,(p.y+p.h/2)*scale-viewport.clientHeight/2),behavior:'instant'})}
function applyZoom(){if(list){$('#space').style.width='100%';$('#space').style.height='auto';board.style.transform='none'}else{$('#space').style.width=extent.w*scale+'px';$('#space').style.height=extent.h*scale+'px';board.style.transform=`scale(${scale})`}$('#zoomStat').textContent=Math.round(scale*100)+'%';updateMini()}
function zoomTo(value){const old=scale,cx=(viewport.scrollLeft+viewport.clientWidth/2)/old,cy=(viewport.scrollTop+viewport.clientHeight/2)/old;scale=Math.max(.16,Math.min(1.8,value));applyZoom();viewport.scrollLeft=Math.max(0,cx*scale-viewport.clientWidth/2);viewport.scrollTop=Math.max(0,cy*scale-viewport.clientHeight/2)}
function setList(value){list=value;$('.canvas-shell').classList.toggle('list',list);$('#listToggle').setAttribute('aria-pressed',String(list));$('#listToggle').textContent=list?'树状网络':'阅读列表';if(!list)render();applyZoom();viewport.scrollTo(0,0)}
$('#fieldMode').onclick=()=>setMode('field');$('#branchMode').onclick=()=>setMode('branch');$('#projectMode').onclick=()=>setMode('project');$('#topic').onchange=()=>{if(mode==='field'&&$('#topic').value!=='all'){branchId=$('#topic').value;setMode('branch')}else filter()};$('#type').onchange=()=>filter();$('#person').onchange=()=>filter();$('#query').oninput=()=>filter();$('#reset').onclick=()=>setMode(mode);$('#listToggle').onclick=()=>setList(!list);$('#filterToggle').onclick=()=>{const open=$('#filters').classList.toggle('open');$('#filterToggle').setAttribute('aria-expanded',String(open))};$('#closeDrawer').onclick=()=>{const old=selected;$('#drawer').hidden=true;selected=null;highlight();nodes.get(old)?.focus({preventScroll:true})};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#drawer').hidden=true;selected=null;highlight()}});$('#zoomIn').onclick=()=>zoomTo(scale*1.2);$('#zoomOut').onclick=()=>zoomTo(scale/1.2);$('#normal').onclick=()=>{zoomTo(1);if(selected)centerNode(selected)};$('#fit').onclick=()=>{scale=Math.min(1,(viewport.clientWidth-25)/extent.w,(viewport.clientHeight-25)/extent.h);applyZoom();viewport.scrollTo(0,0)};
$('#peopleInfo').onclick=()=>{const selectedPerson=$('#person').value;$('#detail').innerHTML=S.entities.people.filter(p=>selectedPerson==='all'||p.id===selectedPerson).map(p=>`<h2>${escapeHTML(p.name)}</h2><p class="small">${escapeHTML(p.role)}</p><p>${escapeHTML(p.intro)}</p><p>${escapeHTML(p.relation)}</p><p class="person-links">${p.sources.map(([label,url])=>`<a href="${escapeHTML(url)}" target="_blank" rel="noopener">${escapeHTML(label)}</a>`).join('')}</p>`).join('');$('#drawer').hidden=false;$('#closeDrawer').focus({preventScroll:true})};
viewport.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('.node')||list)return;drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');e.preventDefault()});viewport.addEventListener('pointermove',e=>{if(!drag)return;viewport.scrollLeft=drag.left+drag.x-e.clientX;viewport.scrollTop=drag.top+drag.y-e.clientY});for(const kind of ['pointerup','pointercancel','lostpointercapture'])viewport.addEventListener(kind,()=>{drag=null;viewport.classList.remove('dragging')});

function renderGuide(){const b=N.branches.find(b=>b.id===branchId),group=(title,ids)=>`<h3>${title}</h3>${ids.length?ids.map(id=>{const n=index.get(id);return `<button class="resource" data-record="${id}"><strong>${escapeHTML(n.title)}</strong><span>${escapeHTML(n.brief)}</span>${n.type==='dataset'?`<span>用途：${escapeHTML(n.why)}</span><span>边界：${escapeHTML(n.limit)}</span>`:''}</button>`}).join(''):'<p>本轮未核入可直接使用的资源；不据此断言不存在。</p>'}`;$('#guide').innerHTML=`<button id="hideGuide" style="float:right">收起 ×</button><p>分支导读 · 按研究问题阅读</p><select id="branchSelect" aria-label="选择研究分支">${N.branches.map(n=>`<option value="${n.id}" ${n.id===branchId?'selected':''}>${escapeHTML(n.title)}</option>`).join('')}</select><h2>${escapeHTML(b.question)}</h2>${group('相关数据 · 按用途区分',b.datasets)}${group('代表论文与方法',b.papers)}<h3>证据边界与待核问题</h3>${b.limits.map(x=>`<p>· ${escapeHTML(x)}</p>`).join('')}<p>读到哪里：本轮新增六项资源的官方介绍／论文摘要，未检查全部标注文件。现有论文各自保留读取层级。</p><button id="backField">回领域缩略图</button>`;$('#guide').querySelectorAll('[data-record]').forEach(el=>el.onclick=()=>choose(el.dataset.record));$('#branchSelect').onchange=e=>{branchId=e.target.value;setMode('branch')};$('#hideGuide').onclick=()=>toggleGuide(false);$('#backField').onclick=()=>setMode('field')}
function toggleGuide(show){$('#guide').hidden=!show;$('.canvas-shell').classList.toggle('has-guide',show);applyZoom()}
function renderOverview(){board.querySelectorAll('.node').forEach(n=>n.remove());nodes=new Map();positions={};selected=null;links=[];$('#drawer').hidden=true;$('#guide').hidden=true;$('.canvas-shell').classList.remove('has-guide');$('#guideToggle').hidden=true;
const roots=N.branches.map((b,i)=>({id:'nav:'+b.id,title:b.title,brief:b.brief,x:50,y:55+i*100,branch:b.id}));
const subs=[{id:'shared:concept',title:'词义与情绪概念',brief:'理论 × 语言',x:430,y:105,branch:'language',from:['emotion','language']},{id:'shared:context',title:'人物、表现与情境',brief:'视频 × 理论',x:430,y:285,branch:'video',from:['emotion','video']},{id:'shared:distance',title:'人类判断与表征几何',brief:'相似性 × 模型',x:760,y:375,branch:'geometry',from:['geometry','ai']},{id:'shared:measure',title:'标签与测量效度',brief:'数据 × 语言 × 视频',x:760,y:560,branch:'validation',from:['language','video','validation']},{id:'shared:neural',title:'行为与神经证据',brief:'脑表征 × AI',x:430,y:675,branch:'brain',from:['brain','ai']}];
visible=[...roots,...subs];visible.forEach(n=>{const a=document.createElement('article');a.className='node nav'+(n.from?' sub':'');a.dataset.id=n.id;a.tabIndex=0;a.setAttribute('role','button');a.innerHTML=`<p class="meta">${n.from?'交叉问题':'独立研究入口'}</p><h2>${escapeHTML(n.title)}</h2><p class="brief">${escapeHTML(n.brief)} · 展开 →</p>`;a.onclick=()=>{branchId=n.branch;setMode('branch')};a.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();a.click()}};a.style.left=n.x+'px';a.style.top=n.y+'px';board.append(a);nodes.set(n.id,a);positions[n.id]={x:n.x,y:n.y,h:a.offsetHeight}});subs.forEach(n=>n.from.forEach(from=>links.push({from:'nav:'+from,to:n.id,evidence:'editorial'})));extent={w:1080,h:800};board.style.width=extent.w+'px';board.style.height=extent.h+'px';$('#wires').setAttribute('width',extent.w);$('#wires').setAttribute('height',extent.h);$('#empty').hidden=true;drawLinks();scale=Math.min(1,(viewport.clientWidth-20)/extent.w);if(innerWidth<700)scale=0.82;applyZoom();viewport.scrollTo(0,0);$('#count').textContent='7条独立路线 · 5个交叉问题 · 点击展开分支';$('#viewNote').textContent='问题导航；位置与线条不编码年代或学术传承';window.__FOREST_READY__={mode:'field',visible:12,roots:7,merges:5,total:S.nodes.length};}
function updateMini(){const mini=$('#minimap');if(!mini||!Object.keys(positions).length)return;const fx=200/extent.w,fy=110/extent.h;mini.innerHTML=links.map(e=>`<path d="${pathFor(e)}" transform="scale(${fx} ${fy})" vector-effect="non-scaling-stroke"/>`).join('')+Object.values(positions).map(p=>`<circle cx="${(p.x+5)*fx}" cy="${(p.y+28)*fy}" r="1.6"/>`).join('')+`<rect x="${viewport.scrollLeft/scale*fx}" y="${viewport.scrollTop/scale*fy}" width="${Math.min(200,viewport.clientWidth/scale*fx)}" height="${Math.min(110,viewport.clientHeight/scale*fy)}"/>`}
let miniDrag=false;function locateMini(e){const r=$('#minimap').getBoundingClientRect();viewport.scrollTo({left:(e.clientX-r.left)/r.width*extent.w*scale-viewport.clientWidth/2,top:(e.clientY-r.top)/r.height*extent.h*scale-viewport.clientHeight/2});updateMini()}
$('#minimap').addEventListener('pointerdown',e=>{miniDrag=true;$('#minimap').setPointerCapture(e.pointerId);locateMini(e)});$('#minimap').addEventListener('pointermove',e=>{if(miniDrag)locateMini(e)});$('#minimap').addEventListener('pointerup',()=>miniDrag=false);$('#minimap').addEventListener('pointercancel',()=>miniDrag=false);viewport.addEventListener('scroll',updateMini);
$('#timeUntil').oninput=e=>{$('#timeYear').textContent=e.target.value;if(mode==='field'){$('#timeLabel').textContent='时间筛选在展开分支／项目中生效';return}filter()};$('#guideToggle').onclick=()=>toggleGuide($('#guide').hidden);

let resize;addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(()=>{applyZoom()},100)});setMode('field');
</script></body></html>
